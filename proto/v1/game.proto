syntax = "proto3";

package game.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yourorg/pokemon_game/proto/v1;gamev1";

service Greeter {
  // A Unary RPC: one request, one response
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

service GameService {
  // resolve a single turn and return the updated state
  rpc ResolveTurn (TurnRequest) returns (GameState);

  // get current game state
  rpc GetState (GetStateRequest) returns (GameState);

  // subscribe to state updates (server streaming)
  rpc SubscribeState (SubscribeRequest) returns (stream GameState);

  // join or create a session
  rpc JoinSession (JoinRequest) returns (GameState);
}

enum Turn {
  TURN_UNSPECIFIED = 0;
  TURN_PLAYER1 = 1;
  TURN_PLAYER2 = 2;
  TURN_CPU = 3;
}

enum GameStatus {
  GAMESTATUS_UNSPECIFIED = 0;
  GAMESTATUS_IDLE = 1;
  GAMESTATUS_ACTIVE = 2;
  GAMESTATUS_FINISHED = 3;
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message TurnRequest {
  string session_id = 1;
  string attacker_id = 2;
  string move_id = 3;
  string defender_id = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message GetStateRequest {
  string session_id = 1;
}

message SubscribeRequest {
  string session_id = 1;
  string subscriber_id = 2;
}

message JoinRequest {
  string session_id = 1;
  string player_id = 2;
}

message PokemonState {
  string id = 1;
  string name = 2;
  int32 current_hp = 3;
  int32 max_hp = 4;
  bool is_fainted = 5;
  // add more fields as needed (level, status, stats, types...)
}

message GameState {
  string session_id = 1;
  repeated PokemonState player = 2;
  repeated PokemonState opponent = 3;
  bool is_game_over = 4;
  Turn current_turn = 5;
  string last_action_summary = 6;
  GameStatus status = 7;
  // reserved field numbers for future use:
  // reserved 100 to 199;
}